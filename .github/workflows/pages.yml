name: Deploy public/ to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "scripts/**"
      - "public/**"
      - "package.json"
      - ".github/workflows/pages.yml"
  # Commits pushed by another workflow using the default GITHUB_TOKEN (e.g. the Notion sync bot)
  # do not trigger the `push` event above -- that's a deliberate GitHub anti-loop safeguard, not
  # a bug -- so without this, every bot-authored sync would land in main but never actually
  # deploy until some other, human-authored push happened to come along afterward.
  workflow_run:
    workflows: ["Sync approved Notion news"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run news:verify-generated
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
